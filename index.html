<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PET+ | Mais Cuidado, Mais Vida</title>
    <meta name="description" content="Seu universo pet. Mais cuidado, mais vida." />
    <link rel="icon" href="assets/pet-24.png" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="assets/leaflet.js"></script>
    <script defer src="runtime.js"></script>
    <script defer src="interface.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="min-h-screen flex items-center justify-center bg-[#f2f8f4] px-4 py-10">
        <div class="w-full max-w-md">
          <div class="text-center mb-10">
            <div
              class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-[#0b5e62] mb-4 overflow-hidden"
            >
              <span class="inline-block relative w-full h-full object-cover"
                ><span class="block relative w-full h-full overflow-hidden"
                  ><img
                    src="assets/pet-24.png"
                    alt="PET+"
                    class="w-full h-full inset-0 absolute object-cover" /></span
              ></span>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-[#13484b]">Bem-vinda de volta</h1>
            <p class="text-muted-foreground mt-2">Acesse sua conta PET+</p>
          </div>
          <div class="bg-white rounded-[26px] shadow-xl shadow-[#0e5a5c]/5 border border-[#dfebe6] p-8">
            <button class="native-button native-outline w-full h-12 text-sm font-medium mb-6">
              <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                  fill="#4285F4"
                ></path>
                <path
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  fill="#34A853"
                ></path>
                <path
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  fill="#FBBC05"
                ></path>
                <path
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  fill="#EA4335"
                ></path></svg
              >Continuar com Google
            </button>
            <div class="relative mb-6">
              <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-border"></div>
              </div>
              <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-card px-3 text-muted-foreground">ou</span>
              </div>
            </div>
            <form class="space-y-4">
              <div class="space-y-2">
                <label for="email" class="text-sm font-medium leading-none">Email</label>
                <div class="relative">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-mail absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"
                    aria-hidden="true"
                  >
                    <rect width="20" height="16" x="2" y="4" rx="2" key="18n3k1"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" key="1ocrg3"></path></svg
                  ><input
                    id="email"
                    type="email"
                    autocomplete="email"
                    autofocus
                    placeholder="you@example.com"
                    value=""
                    required
                    class="native-input pl-10 h-12"
                  />
                </div>
              </div>
              <div class="space-y-2">
                <div class="flex items-center justify-between">
                  <label for="password" class="text-sm font-medium leading-none">Senha</label
                  ><a class="text-xs text-primary hover:underline" href="forgot-password.html"
                    >Esqueceu a senha?</a
                  >
                </div>
                <div class="relative">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-lock absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"
                    aria-hidden="true"
                  >
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" key="1w4ew1"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" key="fwvmzm"></path></svg
                  ><input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="••••••••"
                    value=""
                    required
                    class="native-input pl-10 h-12"
                  />
                </div>
              </div>
              <button type="submit" class="native-button native-primary w-full h-12 font-medium">
                Entrar
              </button>
            </form>
          </div>
          <p class="text-center text-sm text-muted-foreground mt-6">
            Ainda não tem uma conta?
            <a class="text-primary font-medium hover:underline" href="register.html">Criar conta</a>
          </p>
        </div>
      </div>
      <button
        aria-label="Acessibilidade PET+"
        class="a11y-skip fixed z-[90] w-14 h-14 rounded-full bg-[#0c6468] text-white shadow-lg shadow-[#0c6468]/30 grid place-items-center text-2xl touch-none select-none hover:scale-105 transition-transform"
        style="left: 0; top: 0; opacity: 0"
      >
        ♿</button
      ><button
        aria-label="SOS — Emergência"
        class="a11y-skip fixed bottom-24 left-5 lg:left-[268px] z-[90] flex items-center gap-2 bg-red-600 text-white font-extrabold text-base px-6 py-4 rounded-full shadow-lg shadow-red-600/40 hover:bg-red-700 transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-triangle-alert"
        >
          <path
            d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"
            key="wmoenq"
          ></path>
          <path d="M12 9v4" key="juzpu7"></path>
          <path d="M12 17h.01" key="p32p05"></path>
        </svg>
        <span>SOS</span>
      </button>
      <div class="base44-copy">
        <img src="assets/pet-27.png" alt="base44" /><span>Edit with <strong>Base44</strong></span
        ><button aria-label="Close badge">×</button>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PET+ | Mais Cuidado, Mais Vida</title>
    <meta name="description" content="Seu universo pet. Mais cuidado, mais vida." />
    <link rel="icon" href="assets/pet-24.png" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="assets/leaflet.js"></script>
    <script defer src="runtime.js"></script>
    <script defer src="interface.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="min-h-screen flex items-center justify-center bg-[#f2f8f4] px-4 py-10">
        <div class="w-full max-w-md">
          <div class="text-center mb-10">
            <div
              class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-[#0b5e62] mb-4 overflow-hidden"
            >
              <span class="inline-block relative w-full h-full object-cover"
                ><span class="block relative w-full h-full overflow-hidden"
                  ><img
                    src="assets/pet-24.png"
                    alt="PET+"
                    class="w-full h-full inset-0 absolute object-cover" /></span
              ></span>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-[#13484b]">Recuperar senha</h1>
            <p class="text-muted-foreground mt-2">Enviaremos um link para redefinir sua senha</p>
          </div>
          <div class="bg-white rounded-[26px] shadow-xl shadow-[#0e5a5c]/5 border border-[#dfebe6] p-8">
            <form class="space-y-4">
              <div class="space-y-2">
                <label for="email" class="text-sm font-medium leading-none">Endereço de e-mail</label>
                <div class="relative">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-mail absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground"
                    aria-hidden="true"
                  >
                    <rect width="20" height="16" x="2" y="4" rx="2" key="18n3k1"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" key="1ocrg3"></path></svg
                  ><input
                    id="email"
                    type="email"
                    autocomplete="email"
                    autofocus
                    placeholder="you@example.com"
                    value=""
                    required
                    class="native-input pl-10 h-12"
                  />
                </div>
              </div>
              <button type="submit" class="native-button native-primary w-full h-12 font-medium">
                Enviar link de recuperação
              </button>
            </form>
          </div>
          <p class="text-center text-sm text-muted-foreground mt-6">
            <a class="text-primary font-medium hover:underline" href="login.html"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-arrow-left w-3 h-3 inline mr-1"
              >
                <path d="m12 19-7-7 7-7" key="1l729n"></path>
                <path d="M19 12H5" key="x3x0zl"></path></svg
              >Voltar para o login</a
            >
          </p>
        </div>
      </div>
      <button
        aria-label="Acessibilidade PET+"
        class="a11y-skip fixed z-[90] w-14 h-14 rounded-full bg-[#0c6468] text-white shadow-lg shadow-[#0c6468]/30 grid place-items-center text-2xl touch-none select-none hover:scale-105 transition-transform"
        style="left: 0; top: 0; opacity: 0"
      >
        ♿</button
      ><button
        aria-label="SOS — Emergência"
        class="a11y-skip fixed bottom-24 left-5 lg:left-[268px] z-[90] flex items-center gap-2 bg-red-600 text-white font-extrabold text-base px-6 py-4 rounded-full shadow-lg shadow-red-600/40 hover:bg-red-700 transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-triangle-alert"
        >
          <path
            d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"
            key="wmoenq"
          ></path>
          <path d="M12 9v4" key="juzpu7"></path>
          <path d="M12 17h.01" key="p32p05"></path>
        </svg>
        <span>SOS</span>
      </button>
      <div class="base44-copy">
        <img src="assets/pet-27.png" alt="base44" /><span>Edit with <strong>Base44</strong></span
        ><button aria-label="Close badge">×</button>
      </div>
    </div>
  </body>
</html>
